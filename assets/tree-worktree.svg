<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="ttl desc" preserveAspectRatio="xMidYMid meet">
<title id="ttl">The Layer On Disk — the .maestro/ tree</title>
<desc id="desc">A diagram of the .maestro directory: state.json (where the graph left off), ledger.jsonl (the trace, with stamped entries), holds.jsonl (the drawer of your decisions), routing/ (the make assignments), views/ (the morning briefing), and the missions/&lt;id&gt;/ branch holding brief.json, progress.jsonl, envelopes/, artifacts/ and mailbox/.</desc>

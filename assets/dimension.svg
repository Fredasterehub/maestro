<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860" role="img" aria-labelledby="dttl ddesc" preserveAspectRatio="xMidYMid meet">
<title id="dttl">The Dimension &#8212; the agent layer, drawn</title>
<desc id="ddesc">A network diagram of the agent layer beneath a session. Above the boundary lies the surface: the maestro seat straddling the edge, and your chair, outside the graph entirely. Below the boundary lies the graph plane: maestro dispatches to planner, planner fans out to executor-sol, executor-claude and executor-gemini, each executor's work is audited by a reviewer of a different make, and signed work merges back to maestro. A revise loop returns work to its executor twice at most. Work still blocked climbs a red escalation edge into the convergence room, where two rival makes run two passes. Support seats &#8212; context-keeper, scout, researcher, crystallizer, fleet-medic, handoff-recorder &#8212; are consulted inside the graph and never surface. One yellow edge leaves the plane for your chair carrying an S1 with both positions verbatim; a thinner yellow edge carries intent questions straight from maestro to you, skipping the ladder.</desc>
<style>
  @media (prefers-reduced-motion: reduce) { .pulse { opacity: 0; } }
</style>

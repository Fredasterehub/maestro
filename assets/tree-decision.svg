<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1300" width="1200" height="1300" role="img" aria-labelledby="ttl desc" preserveAspectRatio="xMidYMid meet">
<title id="ttl">How the layer decides</title>
<desc id="desc">A decision flow. A request arrives. If it is about what you want, it goes straight to your chair. If it can just be answered, it is answered on the spot. Otherwise: scaffold the graph, write the dispatch brief, a construct takes it to an isolated branch, an auditor from a rival make checks it, and on approval Oscar merges the work into the trunk and leaves you one short note. Work sent back revises twice at most, then a distinct approach, then two adversary cores in a locked room, and only what nobody can settle reaches your chair — both positions verbatim.</desc>
<style>
  @media (prefers-reduced-motion: reduce) { .pulse { opacity: 0; } }
</style>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#F0E9DC" stroke-opacity=".05" stroke-width="1"/>
  </pattern>
  <marker id="a-cream" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0.6L10 5L0 9.4z" fill="#F0E9DC" fill-opacity=".95"/>
  </marker>
  <marker id="a-yellow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0.6L10 5L0 9.4z" fill="#FFD24A" fill-opacity=".95"/>
  </marker>
  <marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0.6L10 5L0 9.4z" fill="#E13B2F" fill-opacity=".95"/>
  </marker>
</defs>
<rect width="1200" height="1300" fill="#0B0B0C"/>
<rect width="1200" height="1300" fill="url(#grid)"/>
<rect x="14" y="14" width="1172" height="1272" fill="none" stroke="#F0E9DC" stroke-opacity=".22" stroke-width="2"/>
<rect x="24" y="24" width="1152" height="1252" fill="none" stroke="#F0E9DC" stroke-opacity=".10" stroke-width="1"/>
<path d="M24 50L24 24L50 24" fill="none" stroke="#FF8A00" stroke-opacity=".7" stroke-width="3"/>
<path d="M1176 50L1176 24L1150 24" fill="none" stroke="#FF8A00" stroke-opacity=".7" stroke-width="3"/>
<path d="M24 1250L24 1276L50 1276" fill="none" stroke="#FF8A00" stroke-opacity=".7" stroke-width="3"/>
<path d="M1176 1250L1176 1276L1150 1276" fill="none" stroke="#FF8A00" stroke-opacity=".7" stroke-width="3"/>
<text font-size="34" letter-spacing="6" fill="#F0E9DC" x="56" y="86">HOW THE LAYER DECIDES</text>
<text font-size="15" letter-spacing="1" fill="#FF8A00" x="58" y="114">one request, from the boundary to your chair</text>
<line x1="56" y1="136" x2="1144" y2="136" stroke="#F0E9DC" stroke-opacity=".18" stroke-width="1"/>
<rect x="812" y="40" width="332" height="82" fill="#1B1B1E" stroke="#F0E9DC" stroke-opacity=".22" stroke-width="1.5"/>
<line x1="830" y1="60" x2="862" y2="60" stroke="#F0E9DC" stroke-opacity="0.9" stroke-width="4"/>
<text font-size="12" fill="#F0E9DC" fill-opacity=".7" x="874" y="64">the layer at work</text>
<line x1="830" y1="84" x2="862" y2="84" stroke="#E13B2F" stroke-opacity="0.95" stroke-width="4"/>
<text font-size="12" fill="#F0E9DC" fill-opacity=".7" x="874" y="88">it went up the ladder</text>
<line x1="830" y1="108" x2="862" y2="108" stroke="#FFD24A" stroke-opacity="0.95" stroke-width="4"/>
<text font-size="12" fill="#F0E9DC" fill-opacity=".7" x="874" y="112">your chair — yours alone</text>
<text font-size="11" letter-spacing="3" fill="#FFD24A" x="342" y="158">THE HAPPY PATH</text>
<rect x="340" y="170" width="520" height="58" rx="4" fill="#1B1B1E" stroke="#F0E9DC" stroke-opacity="0.9" stroke-width="3"/>
<rect x="343" y="173" width="6" height="52" fill="#FF8A00"/>
<text font-size="19" letter-spacing="0.3" fill="#F0E9DC" x="600" y="206" text-anchor="middle">A request arrives at the boundary</text>
<path d="M356 258H844L860 274V318L844 334H356L340 318V274Z" fill="#1B1B1E" stroke="#F0E9DC" stroke-opacity="0.9" stroke-width="3"/>
<text font-size="19" letter-spacing="0.3" fill="#F0E9DC" x="600" y="292" text-anchor="middle">Is this about what you want?</text>
<text font-size="13" fill="#FF8A00" fill-opacity=".92" x="600" y="314" text-anchor="middle">as opposed to how it gets done</text>
<path d="M356 364H844L860 380V424L844 440H356L340 424V380Z" fill="#1B1B1E" stroke="#F0E9DC" stroke-opacity="0.9" stroke-width="3"/>
<text font-size="19" letter-spacing="0.3" fill="#F0E9DC" x="600" y="398" text-anchor="middle">Can it just be answered?</text>
<text font-size="13" fill="#FF8A00" fill-opacity=".92" x="600" y="420" text-anchor="middle">a question, a look-up, a one-liner</text>
<rect x="340" y="470" width="520" height="56" rx="4" fill="#1B1B1E" stroke="#F0E9DC" stroke-opacity="0.9" stroke-width="3"/>
<rect x="343" y="473" width="6" height="50" fill="#FF8A00"/>
<text font-size="19" letter-spacing="0.3" fill="#F0E9DC" x="368" y="496">Scaffold the graph</text>
<text font-size="13" fill="#FF8A00" fill-opacity=".92" x="368" y="514">first time in this layer only</text>
<rect x="340" y="556" width="520" height="72" rx="4" fill="#1B1B1E" stroke="#F0E9DC" stroke-opacity="0.9" stroke-width="3"/>
<rect x="343" y="559" width="6" height="66" fill="#FF8A00"/>
<text font-size="19" letter-spacing="0.3" fill="#F0E9DC" x="368" y="588">Write the dispatch brief</text>
<text font-size="13" fill="#FF8A00" fill-opacity=".92" x="368" y="610">the outcome, the scope, what counts as done</text>
<rect x="340" y="658" width="520" height="72" rx="4" fill="#1B1B1E" stroke="#F0E9DC" stroke-opacity="0.9" stroke-width="3"/>
<rect x="343" y="661" width="6" height="66" fill="#FF8A00"/>
<text font-size="19" letter-spacing="0.3" fill="#F0E9DC" x="368" y="690">A construct takes it to an isolated branch</text>
<text font-size="13" fill="#FF8A00" fill-opacity=".92" x="368" y="712">its own copy of the graph; nothing else is touched</text>
<rect x="340" y="760" width="520" height="72" rx="4" fill="#1B1B1E" stroke="#F0E9DC" stroke-opacity="0.9" stroke-width="3"/>
<rect x="343" y="763" width="6" height="66" fill="#FF8A00"/>
<text font-size="19" letter-spacing="0.3" fill="#F0E9DC" x="368" y="792">An auditor from a rival make</text>
<text font-size="13" fill="#FF8A00" fill-opacity=".92" x="368" y="814">never the one who built it</text>
<path d="M354 862H846L860 876V908L846 922H354L340 908V876Z" fill="#1B1B1E" stroke="#F0E9DC" stroke-opacity="0.9" stroke-width="3"/>
<text font-size="19" letter-spacing="0.3" fill="#F0E9DC" x="600" y="900" text-anchor="middle">Approved?</text>
<rect x="340" y="952" width="520" height="68" rx="4" fill="#1B1B1E" stroke="#F0E9DC" stroke-opacity="0.9" stroke-width="3"/>
<rect x="343" y="955" width="6" height="62" fill="#FF8A00"/>
<text font-size="19" letter-spacing="0.3" fill="#F0E9DC" x="368" y="982">Oscar merges the work into the trunk</text>
<text font-size="13" fill="#FF8A00" fill-opacity=".92" x="368" y="1004">he is the only one who touches the trunk</text>
<rect x="340" y="1050" width="520" height="68" rx="4" fill="#1B1B1E" stroke="#F0E9DC" stroke-opacity="0.9" stroke-width="3"/>
<rect x="343" y="1053" width="6" height="62" fill="#FF8A00"/>
<text font-size="19" letter-spacing="0.3" fill="#F0E9DC" x="368" y="1080">One short note to you</text>
<text font-size="13" fill="#FF8A00" fill-opacity=".92" x="368" y="1102">what changed, and what it cost</text>
<text font-size="12" fill="#F0E9DC" fill-opacity=".4" x="560" y="1146" text-anchor="middle">and he is already on the next node.</text>
<path d="M600 228V258" fill="none" stroke="#F0E9DC" stroke-opacity=".55" stroke-width="2.5" marker-end="url(#a-cream)"></path>
<path d="M600 334V364" fill="none" stroke="#F0E9DC" stroke-opacity=".55" stroke-width="2.5" marker-end="url(#a-cream)"></path>
<path d="M600 440V470" fill="none" stroke="#F0E9DC" stroke-opacity=".55" stroke-width="2.5" marker-end="url(#a-cream)"></path>
<path d="M600 526V556" fill="none" stroke="#F0E9DC" stroke-opacity=".55" stroke-width="2.5" marker-end="url(#a-cream)"></path>
<path d="M600 628V658" fill="none" stroke="#F0E9DC" stroke-opacity=".55" stroke-width="2.5" marker-end="url(#a-cream)"></path>
<path d="M600 730V760" fill="none" stroke="#F0E9DC" stroke-opacity=".55" stroke-width="2.5" marker-end="url(#a-cream)"></path>
<path d="M600 832V862" fill="none" stroke="#F0E9DC" stroke-opacity=".55" stroke-width="2.5" marker-end="url(#a-cream)"></path>
<path d="M600 922V952" fill="none" stroke="#F0E9DC" stroke-opacity=".55" stroke-width="2.5" marker-end="url(#a-cream)"></path>
<path d="M600 1020V1050" fill="none" stroke="#F0E9DC" stroke-opacity=".55" stroke-width="2.5" marker-end="url(#a-cream)"></path>
<path class="pulse" d="M600 228V258 M600 334V364 M600 440V470 M600 526V556 M600 628V658 M600 730V760 M600 832V862 M600 922V952 M600 1020V1050" fill="none" stroke="#FF8A00" stroke-width="14" stroke-linecap="round" stroke-opacity=".14" stroke-dasharray="12 258"><animate attributeName="stroke-dashoffset" from="0" to="-270" dur="3s" repeatCount="indefinite"/></path>
<path class="pulse" d="M600 228V258 M600 334V364 M600 440V470 M600 526V556 M600 628V658 M600 730V760 M600 832V862 M600 922V952 M600 1020V1050" fill="none" stroke="#FF8A00" stroke-width="6" stroke-linecap="round" stroke-opacity=".9" stroke-dasharray="12 258"><animate attributeName="stroke-dashoffset" from="0" to="-270" dur="3s" repeatCount="indefinite"/></path>
<text font-size="11.5" fill="#F0E9DC" fill-opacity=".55" x="614" y="352">how it gets done</text>
<text font-size="11.5" fill="#F0E9DC" fill-opacity=".55" x="614" y="458">no — it needs constructs</text>
<text font-size="11.5" fill="#F0E9DC" fill-opacity=".55" x="614" y="940">yes</text>
<text font-size="11" letter-spacing="3" fill="#FFD24A" x="50" y="352">THE SMALL DOOR</text>
<rect x="48" y="364" width="252" height="76" rx="4" fill="#1B1B1E" stroke="#F0E9DC" stroke-opacity="0.9" stroke-width="3"/>
<rect x="51" y="367" width="6" height="70" fill="#FFD24A"/>
<path d="M74 424V394a15 15 0 0 1 30 0V424z" fill="#0B0B0C" stroke="#F0E9DC" stroke-opacity=".8" stroke-width="2.5"/>
<circle cx="96" cy="406" r="2.6" fill="#FF8A00"/>
<text font-size="14" letter-spacing="0.2" fill="#F0E9DC" x="114" y="398">Answered on the spot.</text>
<text font-size="12" fill="#FF8A00" fill-opacity=".85" x="114" y="418">no ceremony, no constructs</text>
<path d="M340 402H300" fill="none" stroke="#F0E9DC" stroke-opacity=".55" stroke-width="2.5" marker-end="url(#a-cream)"></path>
<text font-size="11.5" fill="#F0E9DC" fill-opacity=".55" x="320" y="394" text-anchor="middle">yes</text>
<path d="M340 899H312V694H340" fill="none" stroke="#F0E9DC" stroke-opacity=".55" stroke-width="2.5" marker-end="url(#a-cream)"></path>
<text font-size="11.5" fill="#F0E9DC" fill-opacity=".55" x="322" y="890">no</text>
<rect x="96" y="770" width="204" height="62" rx="4" fill="#1B1B1E" stroke="#F0E9DC" stroke-opacity=".45" stroke-width="2"/>
<line x1="300" y1="801" x2="312" y2="801" stroke="#F0E9DC" stroke-opacity=".45" stroke-width="2"/>
<text font-size="15" letter-spacing="0.3" fill="#F0E9DC" x="116" y="796">Revise.</text>
<text font-size="12" fill="#FF8A00" fill-opacity=".85" x="116" y="818">Twice at most.</text>
<text font-size="11" letter-spacing="3" fill="#E13B2F" x="892" y="838">WHEN IT GOES SIDEWAYS</text>
<rect x="890" y="858" width="230" height="94" rx="4" fill="#1B1B1E" stroke="#F0E9DC" stroke-opacity="0.75" stroke-width="3"/>
<rect x="893" y="861" width="6" height="88" fill="#E13B2F"/>
<text font-size="12" fill="#FF8A00" fill-opacity=".85" x="912" y="882">still no, or a construct stuck</text>
<text font-size="15" letter-spacing="0.3" fill="#F0E9DC" x="912" y="908">Try a different way</text>
<text font-size="12" fill="#FF8A00" fill-opacity=".85" x="912" y="930">once, and not the same way</text>
<rect x="890" y="974" width="230" height="88" rx="4" fill="#1B1B1E" stroke="#F0E9DC" stroke-opacity="0.75" stroke-width="3"/>
<rect x="893" y="977" width="6" height="82" fill="#E13B2F"/>
<text font-size="15" letter-spacing="0.3" fill="#F0E9DC" x="912" y="1004">The adversary cores</text>
<text font-size="15" letter-spacing="0.3" fill="#F0E9DC" x="912" y="1024">argue it out</text>
<text font-size="12" fill="#FF8A00" fill-opacity=".85" x="912" y="1044">a locked room. Two passes.</text>
<rect x="890" y="1092" width="230" height="58" rx="4" fill="#1B1B1E" stroke="#F0E9DC" stroke-opacity="0.75" stroke-width="3"/>
<rect x="893" y="1095" width="6" height="52" fill="#E13B2F"/>
<text font-size="15" letter-spacing="0.3" fill="#F0E9DC" x="912" y="1120">Nobody can settle it</text>
<text font-size="12" fill="#FF8A00" fill-opacity=".85" x="912" y="1140">the rare one</text>
<path d="M860 899H890" fill="none" stroke="#E13B2F" stroke-opacity=".26" stroke-width="2.5" marker-end="url(#a-red)"><animate attributeName="stroke-opacity" values=".26;.55;.26" dur="4s" repeatCount="indefinite"/></path>
<path d="M1005 952V974" fill="none" stroke="#E13B2F" stroke-opacity=".26" stroke-width="2.5" marker-end="url(#a-red)"><animate attributeName="stroke-opacity" values=".26;.55;.26" dur="4s" repeatCount="indefinite"/></path>
<path d="M1005 1062V1092" fill="none" stroke="#E13B2F" stroke-opacity=".26" stroke-width="2.5" marker-end="url(#a-red)"><animate attributeName="stroke-opacity" values=".26;.55;.26" dur="4s" repeatCount="indefinite"/></path>
<path d="M1005 1150V1172" fill="none" stroke="#E13B2F" stroke-opacity=".26" stroke-width="2.5" marker-end="url(#a-red)"><animate attributeName="stroke-opacity" values=".26;.55;.26" dur="4s" repeatCount="indefinite"/></path>
<path d="M890 1008H875V907A8 8 0 0 0 875 891V694H860" fill="none" stroke="#FFD24A" stroke-opacity=".7" stroke-width="2.5" marker-end="url(#a-yellow)"></path>
<text font-size="11.5" fill="#FFD24A" transform="translate(886 878) rotate(-90)">they agree</text>
<rect x="671" y="1163" width="478" height="102" rx="8" fill="none" stroke="#FFD24A" stroke-opacity=".14" stroke-width="10"><animate attributeName="stroke-opacity" values=".14;.34;.14" dur="4s" repeatCount="indefinite"/></rect>
<rect x="680" y="1172" width="460" height="84" rx="4" fill="#2A2418" stroke="#FFD24A" stroke-opacity="1" stroke-width="3.5"/>
<rect x="683" y="1175" width="6" height="78" fill="#FFD24A"/>
<text font-size="19" letter-spacing="1" fill="#FFD24A" x="708" y="1208">Brought to you, in your chair</text>
<text font-size="13.5" fill="#FFD24A" fill-opacity=".85" x="708" y="1232">both positions, verbatim. Or one precise question.</text>
<path d="M860 296H1156V1214H1140" fill="none" stroke="#FFD24A" stroke-opacity=".55" stroke-width="2.5" marker-end="url(#a-yellow)"/>
<text font-size="12" fill="#FFD24A" fill-opacity=".9" x="878" y="288">what you want, not how</text>
<text font-size="11" letter-spacing="3" fill="#FFD24A" x="682" y="1160">YOURS ALONE</text>
<text font-size="11.5" letter-spacing="2" fill="#F0E9DC" fill-opacity=".32" transform="translate(62 1160) rotate(-90)">NOTHING REACHES YOUR CHAIR THAT THE LAYER CAN SETTLE ITSELF</text>
<text font-size="13" letter-spacing="1" fill="#FF8A00" fill-opacity=".85" x="56" y="1206">No maker audits its own make.</text>
<text font-size="11.5" letter-spacing="2" fill="#F0E9DC" fill-opacity=".32" x="56" y="1232">MAESTRO · HOW THE LAYER DECIDES</text>
</g>
</svg>
